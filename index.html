<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wordle Solver</title>
  <style>
    :root {
      --gray: #787c7e;
      --yellow: #c9b458;
      --green: #6aaa64;
      --bg: #ffffff;
      --text: #111111;
    }
    body {
      font-family: 'Clear Sans', 'Helvetica Neue', Arial, sans-serif;
      max-width: 400px;
      margin: 0 auto;
      padding: 2rem 1rem;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 { margin-bottom: 0.5rem; font-size: 2rem; }
    p.instructions { text-align: center; color: #666; font-size: 0.9rem; margin-bottom: 2rem; }
    
    input[type="text"] {
      width: 100%;
      padding: 12px;
      font-size: 1.5rem;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.2rem;
      border: 2px solid #d3d6da;
      border-radius: 4px;
      margin-bottom: 1.5rem;
      outline: none;
    }
    input[type="text"]:focus { border-color: var(--gray); }

    .tiles { display: flex; gap: 8px; margin-bottom: 1.5rem; width: 100%; justify-content: center; }
    .tile {
      width: 60px;
      height: 60px;
      border: 2px solid #d3d6da;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: bold;
      text-transform: uppercase;
      cursor: pointer;
      user-select: none;
      transition: background 0.1s, transform 0.1s;
    }
    .tile:active { transform: scale(0.95); }
    .tile[data-state="0"] { background: var(--gray); color: white; border-color: var(--gray); }
    .tile[data-state="1"] { background: var(--yellow); color: white; border-color: var(--yellow); }
    .tile[data-state="2"] { background: var(--green); color: white; border-color: var(--green); }

    button {
      width: 100%;
      padding: 15px;
      font-size: 1.1rem;
      font-weight: bold;
      background: var(--green);
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-bottom: 2rem;
    }
    button:hover { opacity: 0.9; }

    .dashboard {
      width: 100%;
      padding: 15px;
      background: #f3f4f6;
      border-radius: 8px;
      text-align: center;
    }
    .dashboard h3 { margin: 0 0 10px 0; font-size: 1.1rem; }
    .stat { font-size: 1.5rem; font-weight: bold; color: var(--green); margin: 5px 0; }
  </style>
</head>
<body>

  <h1>Solver</h1>
  <p class="instructions">Type a guess, tap the tiles to match your Wordle colors, then calculate the next best word.</p>

  <input type="text" id="guessInput" maxlength="5" placeholder="ENTER WORD" autofocus autocomplete="off">
  
  <div class="tiles" id="tileContainer">
    <div class="tile" data-state="0"></div>
    <div class="tile" data-state="0"></div>
    <div class="tile" data-state="0"></div>
    <div class="tile" data-state="0"></div>
    <div class="tile" data-state="0"></div>
  </div>

  <button id="submitBtn">Calculate Next Guess</button>

  <div class="dashboard">
    <h3>Suggested Next Word:</h3>
    <div class="stat" id="topRecommendation">SALET</div>
    <hr style="border: 0; border-top: 1px solid #ddd; margin: 15px 0;">
    <h3>Possible Words Remaining:</h3>
    <div class="stat" style="color: var(--text);" id="candidateCount">Loading...</div>
  </div>

  <script>
    let solutions = [];
    const tiles = Array.from(document.querySelectorAll('.tile'));
    const input = document.getElementById('guessInput');
    const btn = document.getElementById('submitBtn');

    // Load solutions file
    fetch('./solutions.json')
      .then(res => res.json())
      .then(data => {
        solutions = data;
        document.getElementById('candidateCount').textContent = solutions.length;
      })
      .catch(err => {
        document.getElementById('candidateCount').textContent = "Error loading JSON";
      });

    // Sync input letters to tiles
    input.addEventListener('input', (e) => {
      // Remove non-letters
      e.target.value = e.target.value.replace(/[^a-zA-Z]/g, ''); 
      const val = e.target.value;
      tiles.forEach((tile, i) => {
        tile.textContent = val[i] ? val[i].toUpperCase() : '';
      });
    });

    // Tap tiles to toggle colors: 0 (Gray) -> 1 (Yellow) -> 2 (Green)
    tiles.forEach(tile => {
      tile.addEventListener('click', () => {
        if (!tile.textContent) return; // Don't color empty tiles
        let state = parseInt(tile.getAttribute('data-state'));
        state = (state + 1) % 3;
        tile.setAttribute('data-state', state);
      });
    });

    // Calculate Button Logic
    btn.addEventListener('click', () => {
      const guess = input.value.toLowerCase();
      if (guess.length !== 5) {
        alert("Please enter a full 5-letter word.");
        return;
      }

      const pattern = tiles.map(t => parseInt(t.getAttribute('data-state')));

      // Filter remaining words
      solutions = solutions.filter(word => matchesPattern(word, guess, pattern));

      // Update Dashboard
      document.getElementById('candidateCount').textContent = solutions.length;
      document.getElementById('topRecommendation').textContent = getBestGuess(solutions);

      // Reset for next turn
      input.value = '';
      tiles.forEach(t => {
        t.textContent = '';
        t.setAttribute('data-state', '0');
      });
    });

    // Check if a possible word matches the colors we just entered
    function matchesPattern(solution, guess, pattern) {
      let solArr = solution.split('');
      let guessArr = guess.split('');

      // Check Greens First
      for (let i = 0; i < 5; i++) {
        if (pattern[i] === 2) {
          if (solArr[i] !== guessArr[i]) return false;
          solArr[i] = null; // consume
        }
      }

      // Check Yellows & Grays
      for (let i = 0; i < 5; i++) {
        if (pattern[i] === 1) { // Yellow
          if (solArr[i] === guessArr[i]) return false;
          const idx = solArr.indexOf(guessArr[i]);
          if (idx === -1) return false;
          solArr[idx] = null; // consume
        } else if (pattern[i] === 0) { // Gray
          if (solArr.indexOf(guessArr[i]) !== -1) return false;
        }
      }
      return true;
    }

    // Rank remaining words by letter frequency
    function getBestGuess(candidates) {
      if (candidates.length === 0) return "NONE FOUND";
      if (candidates.length === 1) return candidates[0].toUpperCase();

      const freqs = {};
      candidates.forEach(w => {
        // Count unique letters per word to favor words with diverse letters
        new Set(w.split('')).forEach(char => {
          freqs[char] = (freqs[char] || 0) + 1;
        });
      });

      let bestWord = candidates[0];
      let bestScore = -1;

      candidates.forEach(w => {
        const score = Array.from(new Set(w.split(''))).reduce((sum, char) => sum + (freqs[char] || 0), 0);
        if (score > bestScore) {
          bestScore = score;
          bestWord = w;
        }
      });

      return bestWord.toUpperCase();
    }
  </script>
</body>
</html>
