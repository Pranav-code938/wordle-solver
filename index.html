<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Wordle Guesser</title>
  <style>
    :root {
      --gray: #787c7e;
      --yellow: #c9b458;
      --green: #6aaa64;
      --bg: #ffffff;
      --text: #111111;
    }
    body {
      font-family: 'Clear Sans', 'Helvetica Neue', Arial, sans-serif;
      max-width: 400px;
      margin: 0 auto;
      padding: 2rem 1rem;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    h1 { margin-bottom: 0.5rem; font-size: 2rem; }
    p.instructions { color: #666; font-size: 0.9rem; margin-bottom: 2rem; line-height: 1.4; }
    
    .tiles { display: flex; gap: 8px; margin-bottom: 1.5rem; width: 100%; justify-content: center; }
    .tile {
      width: 60px;
      height: 60px;
      border: 2px solid #d3d6da;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: bold;
      text-transform: uppercase;
      cursor: pointer;
      user-select: none;
      transition: background 0.1s, transform 0.1s;
    }
    .tile:active { transform: scale(0.95); }
    .tile[data-state="0"] { background: var(--gray); color: white; border-color: var(--gray); }
    .tile[data-state="1"] { background: var(--yellow); color: white; border-color: var(--yellow); }
    .tile[data-state="2"] { background: var(--green); color: white; border-color: var(--green); }

    button {
      width: 100%;
      padding: 15px;
      font-size: 1.1rem;
      font-weight: bold;
      background: var(--green);
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-bottom: 1rem;
    }
    button:hover { opacity: 0.9; }
    button:disabled { background: var(--gray); cursor: not-allowed; }
    #resetBtn { background: var(--gray); }

    .dashboard {
      width: 100%;
      padding: 15px;
      background: #f3f4f6;
      border-radius: 8px;
      box-sizing: border-box;
    }
    .stat { font-size: 1.5rem; font-weight: bold; color: var(--green); margin: 5px 0; }
    #wordList { font-size: 0.9rem; color: #666; margin-top: 10px; text-transform: uppercase; }
  </style>
</head>
<body>

  <h1>Auto Guesser</h1>
  <p class="instructions">Enter the word into Wordle.<br>Tap the tiles below to match the colors Wordle gives you, then click Next Guess.</p>

  <div class="tiles" id="tileContainer">
    <div class="tile" data-state="0">L</div>
    <div class="tile" data-state="0">O</div>
    <div class="tile" data-state="0">A</div>
    <div class="tile" data-state="0">D</div>
    <div class="tile" data-state="0">!</div>
  </div>

  <button id="submitBtn" disabled>Loading Dictionary...</button>
  <button id="resetBtn">Start Over</button>

  <div class="dashboard">
    <h3 style="margin: 0 0 10px 0; font-size: 1.1rem;">Possible Words Remaining:</h3>
    <div class="stat" style="color: var(--text);" id="candidateCount">--</div>
    <div id="wordList"></div>
  </div>

  <script>
    let allWords = [];
    let possibleWords = [];
    let currentGuess = "salet"; 
    const tiles = Array.from(document.querySelectorAll('.tile'));
    const btn = document.getElementById('submitBtn');
    
    // Fetch a reliable, single-file Wordle dictionary
    fetch('https://raw.githubusercontent.com/tabatkins/wordle-list/main/words')
      .then(res => {
        if (!res.ok) throw new Error("Network response was not OK");
        return res.text();
      })
      .then(text => {
        // Clean text and ensure we only keep 5-letter words
        allWords = text.split('\n').map(w => w.trim().toLowerCase()).filter(w => w.length === 5);
        
        if (allWords.length === 0) throw new Error("Dictionary parsed empty");
        
        startGame();
      })
      .catch(err => {
        console.error(err);
        btn.textContent = "Network Error loading words";
        alert("Could not load the dictionary. Please check your internet connection.");
      });

    function startGame() {
      possibleWords = [...allWords];
      currentGuess = "salet";
      updateUI();
      btn.textContent = "Generate Next Guess";
      btn.disabled = false;
    }

    function updateUI() {
      const chars = currentGuess.split('');
      tiles.forEach((tile, i) => {
        tile.textContent = chars[i].toUpperCase();
        tile.setAttribute('data-state', '0'); // Reset to gray
      });
      
      document.getElementById('candidateCount').textContent = possibleWords.length;
      
      // Bonus feature: Show the words if there are only a few left!
      if (possibleWords.length <= 15 && possibleWords.length > 1) {
         document.getElementById('wordList').textContent = possibleWords.join(', ');
      } else {
         document.getElementById('wordList').textContent = "";
      }
    }

    // Tap tiles to toggle colors: 0 (Gray) -> 1 (Yellow) -> 2 (Green)
    tiles.forEach(tile => {
      tile.addEventListener('click', () => {
        let state = parseInt(tile.getAttribute('data-state'));
        state = (state + 1) % 3;
        tile.setAttribute('data-state', state);
      });
    });

    // Simulate Wordle's exact logic
    function getPattern(guess, secret) {
      let pattern = [0, 0, 0, 0, 0];
      let secretArr = secret.split('');
      let guessArr = guess.split('');

      // First pass: Exact Matches (Green)
      for (let i = 0; i < 5; i++) {
        if (guessArr[i] === secretArr[i]) {
          pattern[i] = 2;
          secretArr[i] = null;
          guessArr[i] = null;
        }
      }

      // Second pass: Partial Matches (Yellow)
      for (let i = 0; i < 5; i++) {
        if (guessArr[i] !== null) {
          let idx = secretArr.indexOf(guessArr[i]);
          if (idx !== -1) {
            pattern[i] = 1;
            secretArr[idx] = null;
          }
        }
      }
      return pattern;
    }

    // Process the colors the user entered
    btn.addEventListener('click', () => {
      const userPattern = tiles.map(t => parseInt(t.getAttribute('data-state'))).join('');

      // Filter: Keep only words that would generate these exact colors
      possibleWords = possibleWords.filter(word => {
        return getPattern(currentGuess, word).join('') === userPattern;
      });

      if (possibleWords.length === 0) {
        alert("No words match this pattern! Are you sure the colors are entered correctly?");
        return; // Early return so we don't crash
      }
      if (possibleWords.length === 1) {
        currentGuess = possibleWords[0];
        updateUI();
        btn.textContent = "Word Found!";
        btn.disabled = true;
        
        // Color it all green to celebrate
        tiles.forEach(t => t.setAttribute('data-state', '2'));
        return;
      }

      currentGuess = getBestGuess(possibleWords);
      updateUI();
    });

    // Pick best word based on letter frequencies
    function getBestGuess(candidates) {
      const freqs = {};
      candidates.forEach(w => {
        new Set(w.split('')).forEach(char => {
          freqs[char] = (freqs[char] || 0) + 1;
        });
      });

      let bestWord = candidates[0];
      let bestScore = -1;

      candidates.forEach(w => {
        let score = 0;
        new Set(w.split('')).forEach(char => {
          score += freqs[char] || 0;
        });

        if (score > bestScore) {
          bestScore = score;
          bestWord = w;
        }
      });

      return bestWord;
    }

    document.getElementById('resetBtn').addEventListener('click', () => {
      if(allWords.length > 0) startGame();
    });

  </script>
</body>
</html>
